<!doctype html>
<!-- Devs:After Dark YouTube thumbnail: one still frame. A template: scripts/thumbnail.py fills {{EYEBROW}} (the label:
     episode number, guest), {{HEADLINE}} (lines as <div class="ln">, the key word in <em>), {{FACE_MODE}}
     (cutout | photo | none) and {{FACE_SRC}}, stages fonts, assets and GSAP beside it, renders it at 4K, keeps one frame.
     Brand (profiles/devs-after-dark/STYLE.md): Night wash with the amber lamp glow, Playfair Display headline in Cream,
     the key word in amber italic, labels in JetBrains Mono caps in Mute, the wide logo. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-800-italic.woff2") format("woff2"); font-weight: 800; font-style: italic; font-display: block; }
  @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-700-italic.woff2") format("woff2"); font-weight: 700; font-style: italic; font-display: block; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0F1116; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; background:#0F1116; }
  #lamp { position:absolute; inset:0; background: radial-gradient(1000px 760px at 74% 44%, rgba(251,191,36,.16), transparent 70%); }
  #vig { position:absolute; inset:0; background: radial-gradient(1500px 1000px at 50% 50%, transparent 52%, rgba(0,0,0,.45) 100%); }
  #face { position:absolute; display:block; }
  .cutout #face { right:-20px; bottom:0; height:1030px; max-width:980px; object-fit:cover; object-position:50% 0; filter: drop-shadow(0 0 40px rgba(251,191,36,.25)); }
  .photo #face { right:0; top:0; height:1080px; width:1240px; object-fit:cover; object-position:60% 30%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%); mask-image: linear-gradient(90deg, transparent 0%, #000 34%); }
  .none #face { display:none; }
  #eyebrow { position:absolute; left:110px; top:126px; font-family:"JetBrains Mono", monospace; font-weight:500;
    font-size:40px; color:#8A8D99; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  #head { position:absolute; left:104px; top:200px; width:860px; height:600px; display:flex; flex-direction:column; justify-content:center; }
  #headline { font-family:"Playfair Display", serif; font-weight:700; color:#F3EEE2; letter-spacing:-.02em; line-height:1.0; font-size:200px; }
  #headline .ln { white-space:nowrap; }
  #headline em { font-style:italic; font-weight:800; color:#FBBF24; }
  #logo { position:absolute; left:110px; bottom:96px; width:620px; height:auto; display:block; }
</style>
</head>
<body>
  <div id="stage" class="{{FACE_MODE}}" data-composition-id="thumbnail" data-start="0" data-duration="0.5" data-fps="30" data-width="1920" data-height="1080">
    <div id="lamp"></div>
    <img id="face" src="{{FACE_SRC}}" alt="">
    <div id="vig"></div>
    <div id="eyebrow">{{EYEBROW}}</div>
    <div id="head"><div id="headline">{{HEADLINE}}</div></div>
    <img id="logo" src="assets/DevsAfterDark-colon-white.svg" alt="Devs:After Dark">
  </div>
<script src="vendor/gsap.min.js"></script>
<script>
  // the headline as large as its box allows: 200px down to 96px, by width (each line) and height
  function fit() {
    const h = document.getElementById('headline'), boxW = 860, boxH = 600;
    let fs = 200;
    for (; fs >= 96; fs -= 4) {
      h.style.fontSize = fs + 'px';
      const wide = Math.max(...Array.from(h.querySelectorAll('.ln')).map(l => l.scrollWidth));
      if (wide <= boxW && h.scrollHeight <= boxH) break;
    }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  const tl = gsap.timeline({ paused: true });
  tl.set('#stage', { opacity: 1 }, 0);
  tl.set('#stage', { opacity: 1 }, 0.5);
  window.__timelines = window.__timelines || {};
  window.__timelines["thumbnail"] = tl;
</script>
</body>
</html>
