<!doctype html>
<!-- HubSpot end card (15 s). A template: scripts/bookends.py fills {{EYEBROW}} and {{TITLE}} (one span per word):
     "Up next" + the next video when one is named, else the generic "Thanks for watching" + "Keep building"; and {{SUBSCRIBE}}. The outlined box (right) and circle (under the title) are where YouTube's end-screen video and
     subscribe elements go: place them there in YouTube Studio. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "HubSpot Sans"; src: url("fonts/HubSpotSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "HubSpot Serif"; src: url("fonts/HubSpotSerif-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#042729; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden;
    background: radial-gradient(1300px 950px at 70% 50%, #0A3A3C 0%, #042729 70%); font-family:"HubSpot Sans", sans-serif; }
  #grain { position:absolute; left:-72px; top:-72px; width:2064px; height:1224px; opacity:.16;
    background-image: radial-gradient(rgba(245,240,238,.35) 1.2px, transparent 1.3px); background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(1000px 760px at 70% 50%, #000 0%, transparent 75%); mask-image: radial-gradient(1000px 760px at 70% 50%, #000 0%, transparent 75%); }
  .mask { position:absolute; overflow:hidden; }
  #eyebrow-m { left:160px; top:330px; height:70px; width:700px; }
  #eyebrow { display:flex; align-items:center; gap:20px; font-weight:500; font-size:44px; color:#B9CDBE; line-height:70px; }
  #eyebrow i { width:18px; height:18px; border-radius:50%; background:#FF4800; display:inline-block; }
  #title-m { left:150px; top:395px; height:200px; width:820px; }
  #title { font-family:"HubSpot Serif", serif; font-weight:500; font-size:128px; line-height:200px; color:#F5F0EE; letter-spacing:-.015em; white-space:nowrap; }
  #title span { display:inline-block; }
  #rule { position:absolute; left:164px; top:600px; width:300px; height:10px; border-radius:5px; background:#FF4800; transform-origin:0 50%; }
  /* where YouTube's end-screen elements go: the video slot (right) and the subscribe button (left, under the title) */
  #slot { position:absolute; left:1000px; top:326px; width:760px; height:428px; border-radius:20px; border:3px solid rgba(245,240,238,.22);
    background: rgba(245,240,238,.04); }
  #sub { position:absolute; left:164px; top:672px; width:150px; height:150px; border-radius:50%; border:3px solid rgba(252,195,220,.45); }
  #sub-m { left:344px; top:712px; height:70px; width:500px; }
  #sublabel { font-weight:500; font-size:40px; line-height:70px; color:#B9CDBE; }
  /* the HubSpot sprocket (official file), built piece by piece */
  .spr { position:absolute; width:346px; height:356px; transform-origin:0 0; }
  .spr .rot { position:absolute; inset:0; transform-origin:248.6px 208.3px; }
  .spr .pc { position:absolute; inset:0; }
  .spr img { position:absolute; left:0; top:0; width:345.8px; height:356px; display:block; }
  .spr .hub { clip-path: circle(92.5px at 248.6px 208.3px); transform-origin:248.6px 208.3px; }
  .spr .w-t { clip-path: polygon(248.6px 208.3px, 100.0px -290.0px, 249.1px -311.7px, 398.0px -289.8px); }
  .spr .g-t { clip-path: circle(92px at 248.6px 208.3px); }
  .spr .n-t { clip-path: circle(34.5px at 248.8px 46.5px); transform-origin:248.8px 46.5px; }
  .spr .w-bl { clip-path: polygon(248.6px 208.3px, -13.0px 657.7px, -122.9px 572.1px, -206.2px 460.4px); }
  .spr .g-bl { clip-path: circle(92px at 248.6px 208.3px); }
  .spr .n-bl { clip-path: circle(31.6px at 130.8px 323.8px); transform-origin:130.8px 323.8px; }
  .spr .w-tl { clip-path: polygon(248.6px 208.3px, -216.4px -24.5px, -145.0px -131.5px, -49.7px -217.7px); }
  .spr .g-tl { clip-path: circle(92px at 248.6px 208.3px); }
  .spr .n-tl { clip-path: circle(38.0px at 41.5px 38.5px); transform-origin:41.5px 38.5px; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; }
</style>
</head>
<body>
  <div id="stage" data-composition-id="endcard" data-start="0" data-duration="15.0" data-fps="30" data-width="1920" data-height="1080">
    <div id="grain"></div>
    <div id="slot"></div>
    <div id="sub"></div>
    <div class="spr" id="spr" style="left:164px; top:120px;"><div class="rot">
      <div class="pc w-t"><div class="pc g-t"><img src="assets/hubspot-sprocket.svg" alt=""></div></div>
      <div class="pc w-bl"><div class="pc g-bl"><img src="assets/hubspot-sprocket.svg" alt=""></div></div>
      <div class="pc w-tl"><div class="pc g-tl"><img src="assets/hubspot-sprocket.svg" alt=""></div></div>
      <div class="pc n-t"><img src="assets/hubspot-sprocket.svg" alt=""></div>
      <div class="pc n-bl"><img src="assets/hubspot-sprocket.svg" alt=""></div>
      <div class="pc n-tl"><img src="assets/hubspot-sprocket.svg" alt=""></div>
      <div class="pc hub"><img src="assets/hubspot-sprocket.svg" alt=""></div>
    </div></div>
    <div class="mask" id="eyebrow-m"><div id="eyebrow"><i></i>{{EYEBROW}}</div></div>
    <div class="mask" id="title-m"><div id="title">{{TITLE}}</div></div>
    <div id="rule"></div>
    <div class="mask" id="sub-m"><div id="sublabel">{{SUBSCRIBE}}</div></div>
    <div id="fade"></div>
    <audio id="sfx-in" src="sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="20" data-volume="0.35"></audio>
  </div>
<script src="vendor/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.set('#title span', { yPercent: 110 }, 0);
  tl.set(['#eyebrow', '#sublabel'], { y: 70 }, 0);
  tl.set('#rule', { scaleX: 0 }, 0);
  tl.set(['#slot', '#sub'], { scale: 0.92, opacity: 0 }, 0);
  // sprocket: spins in from -120 deg while the ring pops, the spokes grow out, the end circles snap on; ends upright
  tl.set('#spr', { scale: 0.4700 }, 0);
  tl.set('#spr .rot', { rotation: -120 }, 0);
  tl.set('#spr .hub', { scale: 0 }, 0);
  tl.set('#spr .n-t', { scale: 0 }, 0);
  tl.set('#spr .g-t', { clipPath: 'circle(0.0px at 248.6px 208.3px)' }, 0);
  tl.set('#spr .n-bl', { scale: 0 }, 0);
  tl.set('#spr .g-bl', { clipPath: 'circle(0.0px at 248.6px 208.3px)' }, 0);
  tl.set('#spr .n-tl', { scale: 0 }, 0);
  tl.set('#spr .g-tl', { clipPath: 'circle(0.0px at 248.6px 208.3px)' }, 0);
  tl.to('#spr .rot', { rotation: 0, duration: 1.1, ease: 'power3.out' }, 0.05);
  tl.to('#spr .hub', { scale: 1, duration: 0.45, ease: 'back.out(2.2)' }, 0.05);
  tl.fromTo('#spr .g-t', { clipPath: 'circle(90.0px at 248.6px 208.3px)' }, { clipPath: 'circle(133.3px at 248.6px 208.3px)', duration: 0.24, ease: 'power2.out', immediateRender: false }, 0.35);
  tl.to('#spr .n-t', { scale: 1, duration: 0.34, ease: 'back.out(3)' }, 0.54);
  tl.fromTo('#spr .g-bl', { clipPath: 'circle(90.0px at 248.6px 208.3px)' }, { clipPath: 'circle(139.4px at 248.6px 208.3px)', duration: 0.25, ease: 'power2.out', immediateRender: false }, 0.44);
  tl.to('#spr .n-bl', { scale: 1, duration: 0.34, ease: 'back.out(3)' }, 0.64);
  tl.fromTo('#spr .g-tl', { clipPath: 'circle(90.0px at 248.6px 208.3px)' }, { clipPath: 'circle(235.8px at 248.6px 208.3px)', duration: 0.41, ease: 'power2.out', immediateRender: false }, 0.53);
  tl.to('#spr .n-tl', { scale: 1, duration: 0.34, ease: 'back.out(3)' }, 0.89);
  tl.to('#eyebrow', { y: 0, duration: 0.5, ease: 'power3.out' }, 0.05);
  tl.to('#title span', { yPercent: 0, duration: 0.6, ease: 'power4.out', stagger: 0.07 }, 0.12);
  tl.to('#rule', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 0.45);
  tl.to('#slot', { scale: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.3);
  tl.to('#sub', { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' }, 0.55);
  tl.to('#sublabel', { y: 0, duration: 0.5, ease: 'power3.out' }, 0.65);
  tl.to('#grain', { x: 36, y: 36, duration: 15, ease: 'none' }, 0);
  tl.to('#fade', { opacity: 1, duration: 0.7, ease: 'power1.in' }, 14.3);
  window.__timelines = window.__timelines || {};
  window.__timelines["endcard"] = tl;
</script>
</body>
</html>
