<!doctype html>
<!-- HubSpot YouTube thumbnail: one still frame. A template: scripts/thumbnail.py fills {{EYEBROW}} (the series line),
     {{HEADLINE}} (lines as <div class="ln">, the key word in <em>), {{FACE_MODE}} (cutout | photo | none) and
     {{FACE_SRC}}, stages fonts, assets and GSAP beside it, renders it at 4K and keeps one frame.
     Brand (profiles/hubspot/STYLE.md): Deep Teal wash, HubSpot Serif headline in Cream, the key word in Orange, the series
     line in Sage after an Orange dot, the Orange rule, the sprocket. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "HubSpot Sans"; src: url("fonts/HubSpotSans-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "HubSpot Sans"; src: url("fonts/HubSpotSans-Bold.woff2") format("woff2"); font-weight: 700; font-display: block; }
  @font-face { font-family: "HubSpot Serif"; src: url("fonts/HubSpotSerif-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#042729; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden;
    background: radial-gradient(1100px 900px at 76% 46%, #0A3A3C 0%, #042729 72%); font-family:"HubSpot Sans", sans-serif; }
  #grain { position:absolute; inset:0; opacity:.16;
    background-image: radial-gradient(rgba(245,240,238,.35) 1.2px, transparent 1.3px); background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(900px 760px at 76% 46%, #000 0%, transparent 75%); mask-image: radial-gradient(900px 760px at 76% 46%, #000 0%, transparent 75%); }
  /* the face: a cutout standing in the right half, in front of an Orange ring; or the photo, fading into the wash */
  #ring { position:absolute; left:1130px; top:120px; width:760px; height:760px; border-radius:50%; border:18px solid #FF4800; }
  #face { position:absolute; display:block; }
  .cutout #face { right:-30px; bottom:0; height:1040px; max-width:980px; object-fit:cover; object-position:50% 0; }
  .photo #ring, .none #ring { display:none; }
  .photo #face { right:0; top:0; height:1080px; width:1240px; object-fit:cover; object-position:60% 30%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%); mask-image: linear-gradient(90deg, transparent 0%, #000 34%); }
  .none #face { display:none; }
  /* words */
  #eyebrow { position:absolute; left:110px; top:120px; display:flex; align-items:center; gap:22px; font-weight:500;
    font-size:46px; color:#B9CDBE; letter-spacing:.01em; white-space:nowrap; }
  #eyebrow i { width:20px; height:20px; border-radius:50%; background:#FF4800; display:inline-block; flex:none; }
  #head { position:absolute; left:104px; top:210px; width:860px; height:620px; display:flex; flex-direction:column; justify-content:center; }
  #headline { font-family:"HubSpot Serif", serif; font-weight:500; color:#F5F0EE; letter-spacing:-.02em; line-height:1.02; font-size:200px; }
  #headline .ln { white-space:nowrap; }
  #headline em { font-style:normal; color:#FF4800; }
  #rule { width:280px; height:14px; border-radius:7px; background:#FF4800; margin-top:44px; flex:none; }
  #lockup { position:absolute; left:110px; bottom:84px; display:flex; align-items:center; gap:22px; color:#F5F0EE;
    font-weight:500; font-size:40px; letter-spacing:.01em; }
  #lockup img { height:64px; width:auto; display:block; }
</style>
</head>
<body>
  <div id="stage" class="{{FACE_MODE}}" data-composition-id="thumbnail" data-start="0" data-duration="0.5" data-fps="30" data-width="1920" data-height="1080">
    <div id="grain"></div>
    <div id="ring"></div>
    <img id="face" src="{{FACE_SRC}}" alt="">
    <div id="eyebrow"><i></i>{{EYEBROW}}</div>
    <div id="head"><div id="headline">{{HEADLINE}}</div><div id="rule"></div></div>
    <div id="lockup"><img src="assets/hubspot-sprocket.svg" alt="">HubSpot Developers</div>
  </div>
<script src="vendor/gsap.min.js"></script>
<script>
  // the headline as large as its box allows: 200px down to 96px, by width (each line) and height (all lines + rule)
  function fit() {
    const h = document.getElementById('headline'), boxW = 860, boxH = 620 - 58;
    let fs = 200;
    for (; fs >= 96; fs -= 4) {
      h.style.fontSize = fs + 'px';
      const wide = Math.max(...Array.from(h.querySelectorAll('.ln')).map(l => l.scrollWidth));
      if (wide <= boxW && h.scrollHeight <= boxH) break;
    }
  }
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  const tl = gsap.timeline({ paused: true });
  tl.set('#stage', { opacity: 1 }, 0);
  tl.set('#stage', { opacity: 1 }, 0.5);
  window.__timelines = window.__timelines || {};
  window.__timelines["thumbnail"] = tl;
</script>
</body>
</html>
